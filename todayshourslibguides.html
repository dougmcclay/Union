font-size:1rem;}

<!-- The container where the date will be shown -->
    <div id="display-date" class="date-container">Loading date...</div>

    <script>
        function showCurrentDate() {
            // 1. Create a new Date object
            const today = new Date();

            // 2. Define how you want the date to be formatted
            const options = { 
                weekday: 'long',  // e.g., Monday
                year: 'numeric',  // e.g., 2026
                month: 'long',    // e.g., November
                day: 'numeric'    // e.g., 2
            };

            // 3. Format the date based on local system settings
            const formattedDate = today.toLocaleDateString('en-US', options);

            // 4. Inject it into the HTML container
            document.getElementById('display-date').textContent = formattedDate;
        }

        // Run the function when the page loads
        showCurrentDate();
    </script>
