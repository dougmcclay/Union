<style type="text/css">
.its-today {
background-color: rgba(189, 212, 227, 1);
font-weight: bold;
color:black;
}

#this-weeks-hours, #next-weeks-hours {
list-style: none;
padding: 5px 0 0 5px;
}

.dates, .nextdates {
font-family: 'Martel', serif;
font-size: 1.2em;
padding: 0 .3em;
}

.day-of-week {
font-family: 'Martel', serif;
font-size: 1.2em;
font-weight: bold;
}

#weekly-hours-header {
font-family: 'Martel', serif;
font-size: 1.5em;
font-weight: bold;
}

</style>

<script type="text/javascript">
let apis4librarians_WeeksHours = (function() {
  jQuery.getJSON(
    "https://uau.libcal.com/widget/hours/grid?format=json&weeks=4&systemTime=0&callback=?",
    function(json) {
			console.log("json loaded");
			console.log(json);
			class DaysHours {
        constructor(singleDay) {
          let theDate;
          //process and clean up the input
          if (singleDay.date[5] === "0") {
            this.theDate = singleDay.date.substr(6);
          } else {
            this.theDate = singleDay.date.substr(5);
          }
          this.rendered = singleDay.rendered;
        }
        renderMe(dayName) {
          jQuery("#this-weeks-hours").append(
            "<li id='" +
              dayName +
              "-hours'><span class='day-of-week'>" +
              dayName +
              ", " +
              this.theDate +
              ":</span> " +
              "<span class='dates'>" +
              this.rendered +
              "</li>"
          );
        }
        renderWeekMe(dayName) {
          jQuery("#next-weeks-hours").append(
            "<li id='" +
              dayName +
              "-hours'><span class='day-of-week'>" +
              dayName +
              ", " +
              this.theDate +
              ":</span> " +
              "<span class='nextdates'>" +
              this.rendered +
              "</li>"
          );
        }
      }

      const daysOfTheWeek = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
      ];
      const locationDays = json.locations[0].weeks[0];
const locationNextWeek = json.locations[0].weeks[1];
			console.log(locationDays);
      const daysRendered = {};
const weekRendered ={};
      for (let day of daysOfTheWeek) {
        let dayToRender = new DaysHours(locationDays[day]);
        let weekToRender = new DaysHours(locationNextWeek[day]);
        let key = `jQuery{day}_stuff`;
        daysRendered[key] = dayToRender.renderMe(day);
        weekRendered[key] = weekToRender.renderWeekMe(day);
      }
      let highlightDay = (function() {
        //if you would like the hours for today marked in some way use the below and then style with .its-today
        var d = new Date();
        var n = d.getDay();
        switch (n) {
          case 0:
            jQuery("#Sunday-hours .dates").addClass("its-today");
            break;
          case 1:
            jQuery("#Monday-hours .dates").addClass("its-today");
            break;
          case 2:
            jQuery("#Tuesday-hours .dates").addClass("its-today");
            break;
          case 3:
            jQuery("#Wednesday-hours .dates").addClass("its-today");
            break;
          case 4:
            jQuery("#Thursday-hours .dates").addClass("its-today");
            break;
          case 5:
            jQuery("#Friday-hours .dates").addClass("its-today");
            break;
          case 6:
            jQuery("#Saturday-hours .dates").addClass("its-today");
            break;
        }
      })();
    }
  );
})();
</script>

<h2>Library Hours:</h2>
<ul id="this-weeks-hours"></ul>
<br>
<h2>Next Week's Hours:</h2>
<ul id="next-weeks-hours"></ul>
